<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Workspace lifecycle regressions</title></head>
<body>
<div id="root"></div>
<script type="module">
  import { EditorView } from "@codemirror/view";
  import { createElement } from "react";
  import { flushSync } from "react-dom";
  import { createRoot } from "react-dom/client";
  import App from "../../src/App";
  import { beginHealthCheck, finishHealthCheck } from "../../src/healthHistory";
  import { updateSettings } from "../../src/settings";
  import "../../src/styles.css";

  const connection = {
    id: "fixture", name: "Fixture", kind: "postgres", database: "fixture",
    host: "127.0.0.1", port: 5432, user: "fixture", file: "", redisDb: 0,
    cfAccountId: "", options: "", color: "", env: "local", group: "Imported",
    ssh: { enabled: false, host: "", user: "", port: 22, auth: "key", keyPath: "" },
  };
  const session = (sessionId) => ({
    sessionId, kind: connection.kind, serverVersion: sessionId, defaultSchema: "public", sqlProtection: "automatic",
  });
  const result = (columns, rows) => ({ columns, rows, rowsAffected: null, truncated: false, elapsedMs: 1 });
  const tableData = (table) => ({
    sql: `SELECT * FROM ${table}`, result: result(["id", "name"], [[1, `${table} row`]]),
    hasMore: false, rowVersions: ["fixture-version"],
  });

  const calls = [];
  const attempts = new Map();
  const reads = new Map();
  const heldTables = new Set();
  const unexpected = [];
  const callbacks = new Map();
  const nativeListeners = new Map();
  const url = "postgres://reader:p%40ss@sample.invalid:6543/new_db";
  const draft = { ...connection, id: "", group: "", name: "sample.invalid/new_db",
    host: "sample.invalid", port: 6543, database: "new_db", user: "reader" };
  let savedConnection;
  let finishGroupReload;
  let finishCommit;
  let finishQuit;
  let finishUpdateCheck;
  const scenario = new URLSearchParams(location.search).get("case");
  if (scenario === "app-update") {
    window.isTauri = true;
    const schedule = window.setTimeout.bind(window);
    window.setTimeout = (callback, delay, ...args) => schedule(callback, delay === 10_000 ? 50 : delay, ...args);
    updateSettings({ automaticallyCheckForUpdates: true });
  }
  window.__TAURI_INTERNALS__ = {
    transformCallback(callback) {
      const id = callbacks.size + 1;
      callbacks.set(id, callback);
      return id;
    },
    invoke(command, args) {
      calls.push({ command, ...args });
      switch (command) {
        case "plugin:event|listen":
          nativeListeners.set(args.event, args.handler);
          return Promise.resolve(args.handler);
        case "plugin:event|unlisten": return Promise.resolve();
        case "set_menu_language":
        case "begin_connect":
        case "cancel_connect":
        case "disconnect":
        case "begin_browser_request": return Promise.resolve();
        case "connect": return new Promise((resolve, reject) => attempts.set(args.attemptId, { resolve, reject }));
        case "list_connections": return Promise.resolve([savedConnection ?? connection]);
        case "list_groups":
          if (savedConnection) return new Promise(resolve => { finishGroupReload = () => resolve(["Imported", savedConnection.group]); });
          return Promise.resolve(["Imported"]);
        case "tableplus_file": return Promise.resolve(null);
        case "ssh_config_hosts": return Promise.resolve([]);
        case "parse_connection_url":
          if (args.url !== url) return Promise.reject("Enter one supported connection URL.");
          return Promise.resolve({ config: draft, password: "p@ss" });
        case "save_connection":
          if (args.config.id === connection.id) {
            savedConnection = args.config;
            return Promise.resolve(savedConnection);
          }
          return Promise.resolve({ ...args.config, id: "new-connection" });
        case "confirm_quit": return new Promise(resolve => { finishQuit = resolve; });
        case "supports_app_updates": return Promise.resolve(scenario === "app-update");
        case "plugin:app|version": return Promise.resolve("1.1.1");
        case "plugin:updater|check": return new Promise(resolve => { finishUpdateCheck = resolve; });
        case "plugin:updater|download_and_install":
        case "plugin:resources|close": return Promise.resolve();
        case "sql_apply_changes": return new Promise(resolve => { finishCommit = () => resolve(1); });
        case "sql_schemas": return Promise.resolve(["public"]);
        case "sql_databases": return Promise.resolve(["fixture"]);
        case "sql_tables": return Promise.resolve(["first", "second"].map(name => ({ name, kind: "table" })));
        case "sql_completion_session": return Promise.resolve({ schemas: ["public"], searchPath: ["public"] });
        case "sql_columns": return Promise.resolve({});
        case "sql_structure": return Promise.resolve(result(["name", "type", "key"], [["id", "integer", "PRI"], ["name", "text", ""]]));
        case "sql_table_data":
          if (heldTables.has(args.table)) {
            return new Promise((resolve, reject) => reads.set(args.requestId, { resolve, reject }));
          }
          return Promise.resolve(tableData(args.table));
        case "cancel_browser_request":
          reads.get(args.requestId)?.reject(new Error("browser request cancelled"));
          return Promise.resolve();
        case "sql_execute": return Promise.resolve({ results: [result(["name"], [["query result"]])], metadataChanged: false });
        default:
          unexpected.push(command);
          return Promise.reject(new Error(`Unexpected IPC command ${command}`));
      }
    },
  };
  window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
    unregisterListener(event, id) {
      if (nativeListeners.get(event) === id) nativeListeners.delete(event);
    },
  };

  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }

  async function waitFor(find, message) {
    const deadline = performance.now() + 4000;
    do {
      const value = find();
      if (value) return value;
      await new Promise(resolve => setTimeout(resolve, 10));
    } while (performance.now() < deadline);
    throw new Error(message);
  }

  const find = (selector) => document.querySelector(selector);
  const click = (element) => {
    assert(element && !element.disabled, "Expected an enabled control");
    flushSync(() => element.click());
  };
  const selectTab = (name) => click(find(`.sql-tab-select[aria-label="${name}"]`));
  const activePane = () => find(".session:not([hidden]) .tab-pane:not([hidden])");
  const editor = () => EditorView.findFromDOM(activePane().querySelector(".cm-editor"));
  const ipc = (command) => calls.filter(call => call.command === command);

  async function startConnection() {
    const count = attempts.size;
    click(await waitFor(() => find(".card-connect"), "Connection card did not appear"));
    await waitFor(() => attempts.size === count + 1, "Connection attempt did not start");
    return [...attempts.keys()].at(-1);
  }

  async function openWorkspace() {
    const attempt = await startConnection();
    attempts.get(attempt).resolve(session("current-session"));
    await waitFor(() => find('.sql-tab-select[aria-label="Query 1"]'), "SQL workspace did not open");
  }

  async function openTable(name) {
    const button = await waitFor(() => find(`button.link[title="${name}"]`), `Table ${name} did not appear`);
    click(button);
    return waitFor(() => ipc("sql_table_data").find(call => call.table === name), `No data read for ${name}`);
  }

  async function reconnect() {
    const oldAttempt = await startConnection();
    click(find('button[aria-label="Cancel connection"]'));
    assert(ipc("cancel_connect").some(call => call.attemptId === oldAttempt), "Cancel targeted the wrong attempt");
    assert(!find(".connecting-workspace"), "Cancelled connection remained open");
    const newAttempt = await startConnection();
    assert(newAttempt !== oldAttempt, "Reconnect reused the cancelled attempt ID");
    attempts.get(newAttempt).resolve(session("new-session"));
    await waitFor(() => find('.top-tab.on[title="new-session"]'), "The replacement session did not open");

    // Return a success even after cancellation to model an IPC result already in flight.
    attempts.get(oldAttempt).resolve(session("old-session"));
    await waitFor(() => ipc("disconnect").some(call => call.sessionId === "old-session"), "Late session was not disposed");
    assert(!find('.top-tab[title="old-session"]'), "Late attempt opened its own session tab");
    assert(find('.top-tab.on[title="new-session"]'), "Late attempt replaced the active session");
    assert(!ipc("disconnect").some(call => call.sessionId === "new-session"), "Late attempt disconnected the replacement");
  }

  const menuAction = (id) => flushSync(() => window.dispatchEvent(new CustomEvent("dbdock:menu", { detail: id })));
  const buttonWithText = (root, label) => [...root.querySelectorAll("button")].find(button => button.textContent.trim() === label);
  const dialog = () => find(".feedback-dialog[open]");

  async function saveConnectionAndReload() {
    await waitFor(() => find('.tree-name[title="Imported"]') && find('.card-title b[title="Fixture"]'),
      "The connection and group lists did not load");
    flushSync(() => finishHealthCheck(beginHealthCheck(connection), "ok"));
    assert(find(".card-health"), "The fixture should have a saved health result");
    click(find('button[aria-label="Edit"]'));
    const form = await waitFor(() => find(".connection-form"), "Edit connection did not open");
    for (const [field, value] of [[form.querySelector('input[value="Fixture"]'), "Updated fixture"], [form.querySelector('input[list="group-options"]'), "New group"]]) {
      flushSync(() => {
        Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(field, value);
        field.dispatchEvent(new Event("input", { bubbles: true }));
      });
    }
    click(buttonWithText(form, "Save"));
    await waitFor(() => finishGroupReload && !find(".connection-form") && find(".toast-text")?.textContent === "Saved Updated fixture",
      "Saving should close the form, show success, and request a list reload");
    assert(ipc("list_connections").length === 2 && ipc("list_groups").length === 2, "Saving should request both lists once");
    assert(!find(".card-health"), "Saving should clear the old health result");
    assert(find('.card-title b[title="Fixture"]') && !find('.card-title b[title="Updated fixture"]'),
      "The card should await both list responses");
    finishGroupReload();
    await waitFor(() => find('.tree-name[title="New group"]') && find('.card-title b[title="Updated fixture"]'),
      "The refreshed connection and group were not shown");
  }

  async function quitGuard() {
    await waitFor(() => find(".card-connect"), "The connection list did not load");
    menuAction("quit-app");
    menuAction("quit-app");
    assert(ipc("confirm_quit").length === 1 && !dialog(), "Idle quit should invoke IPC once without confirmation");
    finishQuit();
    await new Promise(resolve => setTimeout(resolve, 0));

    menuAction("new-connection");
    const form = await waitFor(() => find(".connection-form"), "The connection form did not open");
    menuAction("quit-app");
    const editing = await waitFor(dialog, "Quit should ask when a form is open");
    click(buttonWithText(editing, "Cancel"));
    assert(find(".connection-form") && ipc("confirm_quit").length === 1, "Cancelling quit should preserve the form");
    flushSync(() => window.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape" })));
    assert(!form.isConnected, "The form did not close");

    const attempt = await startConnection();
    menuAction("quit-app");
    const pending = await waitFor(dialog, "Quit should ask during a connection attempt");
    click(buttonWithText(pending, "Cancel"));
    assert(ipc("confirm_quit").length === 1 && find(".connecting-workspace"), "Cancelling quit should keep the attempt");
    attempts.get(attempt).resolve(session("quit-session"));
    await openTable("first");
    const add = await waitFor(() => {
      const button = find('button[aria-label="Add a row"]');
      return button && !button.disabled && button;
    }, "The table did not become editable");
    click(add);
    click(buttonWithText(find(".pending-bar"), "Commit ⌘S"));
    await waitFor(() => add.disabled && finishCommit, "Commit did not start");
    menuAction("quit-app");
    const busy = await waitFor(dialog, "Quit should report a commit in progress");
    assert(busy.textContent.includes("Wait for the commit to finish before quitting.") && !buttonWithText(busy, "Quit"),
      "A commit in progress should block quitting");
    click(buttonWithText(busy, "OK"));
    assert(ipc("confirm_quit").length === 1, "Blocked quit must not invoke IPC");
    finishCommit();
    await waitFor(() => !find(".pending-bar") && !add.disabled, "Commit did not finish");

    menuAction("quit-app");
    const open = await waitFor(dialog, "Quit should ask with an open connection");
    menuAction("quit-app");
    click(buttonWithText(open, "Quit"));
    await waitFor(() => ipc("confirm_quit").length === 2, "Confirming quit did not invoke IPC");
    assert(!dialog(), "Repeated quit should not queue another confirmation");
    finishQuit();
  }

  async function appUpdate() {
    const update = { rid: 71, currentVersion: "1.1.1", version: "1.2.0", rawJson: {} };
    menuAction("settings");
    await waitFor(() => finishUpdateCheck, "The automatic check did not run");
    const settings = find(".settings-backdrop");
    const panel = [...settings.querySelectorAll("section")].find(section => section.querySelector("h3").textContent.trim() === "Updates");
    const toggle = panel.querySelector('input[type="checkbox"]');
    assert(toggle.checked, "Automatic checks should be enabled");
    click(toggle);
    assert(JSON.parse(localStorage.getItem("dbdock.settings")).automaticallyCheckForUpdates === false, "The toggle did not persist");
    finishUpdateCheck(update);
    await waitFor(() => buttonWithText(panel, "Check for Updates"), "A background result remained visible after disabling checks");
    assert(ipc("plugin:resources|close").length === 1, "The ignored update should be released");
    assert(!buttonWithText(find(".topbar"), "Install 1.2.0"), "A background result must not prompt after disabling checks");

    click(buttonWithText(panel, "Check for Updates"));
    assert(ipc("plugin:updater|check").length === 2, "Manual checking should remain available");
    finishUpdateCheck(update);
    click(await waitFor(() => buttonWithText(panel, "Install 1.2.0"), "The available update was not offered"));
    assert(ipc("plugin:updater|download_and_install").length === 1, "Installation should require an explicit click");
    click(await waitFor(() => buttonWithText(panel, "Restart to finish update"), "Restart was not offered after installation"));
    assert(ipc("confirm_quit")[0]?.restart === true && !dialog(), "Restart should use the existing quit guard");
    finishQuit();
  }

  async function palettesAndFocus() {
    const search = await waitFor(() => find("input.search"), "Connection search was not available");
    const choose = (name) => click([...document.querySelectorAll(".palette-item")]
      .find(item => item.querySelector(".palette-title")?.textContent === name));

    for (const action of ["command-palette", "quick-switch"]) {
      search.focus();
      menuAction(action);
      const input = await waitFor(() => find(".palette-backdrop input"), `The ${action} input did not open`);
      assert(document.activeElement === input, `The ${action} input should take focus`);
      flushSync(() => input.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true })));
      assert(!find(".palette-backdrop") && document.activeElement === search, `Dismissing ${action} should restore focus`);
    }

    let restored = 0;
    const focus = search.focus.bind(search);
    search.focus = (...args) => { restored++; focus(...args); };
    menuAction("command-palette");
    choose("Quick switch");
    await waitFor(() => find('.command-palette[aria-label="Quick switch"]'), "The command did not open Quick Switch after the first palette closed");
    assert(restored === 0, "Running a command should not restore focus before executing it");
    choose("Fixture");
    const attempt = await waitFor(() => [...attempts.keys()][0], "Quick Switch did not route to the selected connection");
    assert(!find(".palette-backdrop") && ipc("connect").length === 1, "Quick Switch should close and start one connection");
    attempts.get(attempt).resolve(session("quick-session"));
    await waitFor(() => find('.top-tab.on[title="quick-session"]'), "The selected connection did not become active");
  }

  async function menuAndShortcuts(root) {
    await openWorkspace();
    const native = (event, payload) => {
      const id = nativeListeners.get(event);
      assert(id !== undefined, `Missing native listener for ${event}`);
      flushSync(() => callbacks.get(id)({ event, id, payload }));
    };
    const key = (type, options, target = window) => {
      const event = new KeyboardEvent(type, { bubbles: true, cancelable: true, ...options });
      flushSync(() => target.dispatchEvent(event));
      return event.defaultPrevented;
    };
    const tab = () => find('.sql-tab-select[aria-pressed="true"]')?.getAttribute("aria-label");

    native("menu", "new-sql-tab");
    assert(tab() === "Query 2", "Native menu did not target the active workspace");
    assert(key("keydown", { key: "1", code: "Digit1", ctrlKey: true }), "Control+1 was not handled");
    assert(find(".top-tab.home.on .tab-number")?.textContent === "1", "Control+1 should select Home and show session numbers");
    key("keydown", { key: "2", code: "Digit2", ctrlKey: true });
    assert(find('.top-tab.on[title="current-session"]') && tab() === "Query 2", "Control+2 did not restore the session");
    assert(key("keydown", { key: "1", code: "Digit1", metaKey: true }), "Command+1 was not handled");
    assert(tab() === "Query 1" && find('.sql-tab-select[aria-label="Query 2"] .tab-number')?.textContent === "2",
      "Command+1 should select the first database tab and show database numbers");
    assert(!key("keydown", { key: "2", code: "Digit2", metaKey: true, isComposing: true }) && tab() === "Query 1",
      "A composing keystroke switched tabs");
    key("keyup", { key: "Meta" });
    assert(!find(".tab-number"), "Releasing Command should hide number hints");
    native("tab-modifier", "ctrl");
    assert(find(".top-tab.home .tab-number"), "The native modifier should show session hints");
    flushSync(() => window.dispatchEvent(new Event("blur")));
    assert(!find(".tab-number"), "Window blur should clear native hints");

    key("keydown", { key: "k", metaKey: true });
    assert(find(".palette-backdrop"), "Command+K should open Quick Switch");
    native("menu", "session-slot-1");
    assert(find('.top-tab.on[title="current-session"]'), "Quick Switch should block session-slot actions");
    key("keydown", { key: "Escape" }, find(".palette-backdrop input"));
    key("keydown", { key: "P", metaKey: true, shiftKey: true, repeat: true });
    assert(!find(".palette-backdrop"), "Holding the palette shortcut should not reopen it");
    key("keydown", { key: "P", metaKey: true, shiftKey: true });
    assert(find(".palette-backdrop"), "Command+Shift+P should open the command palette");
    click([...document.querySelectorAll(".palette-item")].find(item => item.querySelector(".palette-title")?.textContent === "New query"));
    await waitFor(() => tab() === "Query 3", "A palette command should reach the workspace after the palette closes");

    for (const name of ["Query 3", "Query 2", "Query 1"]) {
      selectTab(name);
      native("menu", "close-database-tab");
      assert(!find(`.sql-tab-select[aria-label="${name}"]`) && !find(".feedback-dialog[open]"),
        "Close should be claimed by the current database tab");
    }
    native("menu", "close-database-tab");
    const confirm = await waitFor(() => find(".feedback-dialog[open]"), "With no database tabs, Close should ask before closing the session");
    click([...confirm.querySelectorAll("button")].find(button => button.textContent === "Cancel"));
    assert(find('.top-tab.on[title="current-session"]') && !ipc("disconnect").length, "Cancelling Close should keep the session");

    assert(ipc("plugin:event|listen").length === 2, "Session changes should not resubscribe native listeners");
    flushSync(() => root.unmount());
    await waitFor(() => ipc("plugin:event|unlisten").length === 2, "Both native listeners should be released on unmount");
    assert(nativeListeners.size === 0, "A native listener survived unmount");
  }

  async function failureDoesNotReopenImport() {
    menuAction("import");
    const close = await waitFor(() => find('.modal-head button[aria-label="Close"]'), "Import did not open");
    click(close);
    const attempt = await startConnection();
    attempts.get(attempt).reject("pool timed out while waiting for an open connection");
    await waitFor(() => find(".card-connect") && find(".toast-text")?.textContent.includes("pool timed out"), "The failure did not return to the connection list");
    assert(!find(".modal-backdrop"), "The previous import menu action reopened after the connection failure");
    assert(ipc("tableplus_file").length === 1, "Import mounted again");
  }

  async function newConnectionFromUrl() {
    menuAction("new-connection-url");
    const field = await waitFor(() => find('.connection-form input[aria-label="Connection URL"]'), "The new connection URL field did not open");
    assert(field.type === "text", "The connection URL should be displayed without masking");
    assert(find(".connection-form h2").textContent === "New connection", "URL did not open New Connection");
    assert(!ipc("tableplus_file").length, "URL opened the import dialog");
    flushSync(() => {
      Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(field, url);
      field.dispatchEvent(new Event("input", { bubbles: true }));
    });
    click(find('.connection-form button[type="submit"]'));
    await waitFor(() => !find('.connection-form input[aria-label="Connection URL"]') && find(".connection-form .kind-btn.active")?.textContent.includes("PostgreSQL"), "The URL did not populate the draft");
    assert(ipc("parse_connection_url").length === 1 && !ipc("save_connection").length, "Applying a URL saved a connection before confirmation");
    click([...document.querySelectorAll(".connection-form-actions button")].find(button => button.textContent.trim() === "Save"));
    const saved = await waitFor(() => ipc("save_connection")[0], "No new connection was saved");
    assert(saved.config.id === "" && saved.config.group === "" && saved.config.database === draft.database &&
      saved.config.host === draft.host && saved.config.port === draft.port && saved.secrets.password === "p@ss",
      "The form did not save a new ungrouped connection with the URL settings");
  }

  async function closeTable() {
    heldTables.add("first");
    heldTables.add("second");
    await openWorkspace();
    const first = await openTable("first");
    const second = await openTable("second");
    click(find('button[aria-label="Close tab public.first"]'));
    await waitFor(() => ipc("cancel_browser_request").some(call => call.requestId === first.requestId), "Closing the first table did not cancel its data read");
    const firstReadIds = new Set(calls.filter(call => call.table === "first").map(call => call.requestId));
    assert(ipc("cancel_browser_request").every(call => firstReadIds.has(call.requestId)), "Closing the first table cancelled a read it did not own");
    assert(!find('.sql-tab-select[aria-label="public.first"]'), "Closed table tab is still present");

    reads.get(second.requestId).resolve(tableData("second"));
    await waitFor(() => activePane()?.textContent.includes("second row"), "The other table did not finish loading");
  }

  function enterSql(sql) {
    flushSync(() => {
      const view = editor();
      view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: sql } });
    });
  }

  async function switchTabs() {
    await openWorkspace();
    await waitFor(() => activePane()?.querySelector(".cm-editor"), "The first editor did not mount");
    const firstSql = "SELECT 'first draft';";
    const secondSql = "SELECT 'second draft';";
    enterSql(firstSql);
    click(activePane().querySelector('.query-run button[aria-label^="Run ·"]'));
    await waitFor(() => activePane()?.textContent.includes("query result"), "First query result did not appear");
    assert(ipc("sql_execute").length === 1 && ipc("sql_execute")[0].sql === firstSql, "The first editor submitted different SQL");

    await openTable("second");
    const addRow = await waitFor(() => {
      const button = activePane()?.querySelector('button[aria-label="Add a row"]');
      return button && !button.disabled && button;
    }, "The table did not become editable");
    click(addRow);
    assert(activePane().querySelector(".pending-bar")?.textContent.includes("pending change"), "Expected a pending row insertion");

    click(find(".tab-add"));
    await waitFor(() => activePane()?.querySelector(".cm-editor"), "The second editor did not mount");
    enterSql(secondSql);
    assert(!activePane().textContent.includes("query result"), "The second query inherited the first query's result");
    selectTab("Query 1");
    assert(editor().state.doc.toString() === firstSql, "First query draft was lost");
    assert(activePane().textContent.includes("query result"), "First query result was lost");
    selectTab("Query 2");
    assert(editor().state.doc.toString() === secondSql, "Second query draft was lost");

    selectTab("public.second");
    assert(activePane().querySelector(".pending-bar")?.textContent.includes("pending change"), "Switching tabs discarded the pending edit");
    click(find('button[aria-label="Close tab public.second"]'));
    const dialog = await waitFor(() => find(".feedback-dialog[open]"), "Closing a dirty tab did not request confirmation");
    click([...dialog.querySelectorAll("button")].find(button => button.textContent === "Cancel"));
    assert(activePane().querySelector(".pending-bar"), "Cancelling the confirmation discarded the pending edit");
  }

  try {
    updateSettings({ language: "en", vim: false });
    const root = createRoot(find("#root"));
    flushSync(() => root.render(createElement(App)));
    const cases = { reconnect, "close-table": closeTable, "switch-tabs": switchTabs, "menu-shortcuts": menuAndShortcuts,
      "palettes-focus": palettesAndFocus, "save-reload": saveConnectionAndReload, "quit-guard": quitGuard, "app-update": appUpdate,
      "no-import-replay": failureDoesNotReopenImport, "new-url": newConnectionFromUrl };
    await cases[scenario](root);
    assert(unexpected.length === 0, `Unexpected IPC commands: ${unexpected.join(", ")}`);
    window.webkit.messageHandlers.result.postMessage("ok");
  } catch (error) {
    window.webkit.messageHandlers.result.postMessage(error instanceof Error ? `${error.message}\n${error.stack ?? ""}` : String(error));
  }
</script>
</body>
</html>
